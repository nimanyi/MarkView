<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDViewer</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header" data-tauri-drag-region>
        <span class="app-name" data-tauri-drag-region>MDViewer</span>
        <span class="file-name" id="file-name" data-tauri-drag-region>未命名.md</span>
        <span class="toolbar">
          <button id="btn-new" class="tool-btn" title="新建文档（Ctrl+N）">新建</button>
          <button id="btn-open" class="tool-btn" title="打开文件（Ctrl+O）">打开</button>
          <button id="btn-open-dir" class="tool-btn" title="打开文件夹（Ctrl+Shift+O）">打开文件夹</button>
          <button id="btn-save" class="tool-btn" title="保存（Ctrl+S）">保存</button>
          <button id="btn-save-as" class="tool-btn" title="另存为（Ctrl+Shift+S）">另存为</button>
          <button id="btn-export-html" class="tool-btn" title="导出为独立 HTML 文件（Ctrl+Shift+E）">导出 HTML</button>
          <button id="btn-export-pdf" class="tool-btn" title="打印 / 另存为 PDF（Ctrl+P）">导出 PDF</button>
          <button id="btn-theme" class="tool-btn" title="切换主题（Ctrl+Shift+L）">主题：跟随系统</button>
          <button id="btn-toggle-sidebar" class="tool-btn" title="切换侧边栏（Ctrl+\）">侧栏</button>
        </span>
        <span class="app-hint" id="save-hint" data-tauri-drag-region></span>
      </header>
      <section class="panes">
        <aside class="sidebar" id="sidebar" aria-label="侧边栏">
          <div class="sidebar-tabs" role="tablist">
            <button class="tab-btn active" data-tab="files" role="tab">文件</button>
            <button class="tab-btn" data-tab="outline" role="tab">大纲</button>
            <button class="tab-btn" data-tab="search" role="tab">搜索</button>
          </div>
          <div class="sidebar-pane" data-pane="files">
            <div class="sidebar-header">
              <span class="sidebar-title" id="sidebar-title">文件</span>
              <button id="btn-refresh-tree" class="tool-btn" title="刷新文件树">刷新</button>
            </div>
            <div class="file-tree" id="file-tree"></div>
            <div class="sidebar-empty" id="sidebar-empty">尚未打开文件夹</div>
          </div>
          <div class="sidebar-pane" data-pane="outline" hidden>
            <div class="outline-list" id="outline-list"></div>
            <div class="sidebar-empty" id="outline-empty">文档中暂无标题</div>
          </div>
          <div class="sidebar-pane" data-pane="search" hidden>
            <div class="search-box">
              <input id="search-input" type="text" placeholder="在打开的文件夹中搜索…" />
            </div>
            <div class="search-results" id="search-results">
              <div class="sidebar-empty">按 Ctrl+Shift+F 聚焦搜索</div>
            </div>
          </div>
        </aside>
        <div id="editor-host" class="editor-host" aria-label="Markdown 编辑器"></div>
        <article id="preview" class="preview" aria-label="渲染预览"></article>
      </section>
      <footer class="app-footer">
        <span id="stat-pos">行 1，列 1</span>
        <span id="stat-count">0 字符</span>
        <span class="spacer"></span>
        <button id="btn-update" class="tool-btn footer-btn" title="检查更新（Ctrl+Shift+U）">检查更新</button>
        <span class="footer-brand" id="app-version" title="应用版本"></span>
        <span class="footer-brand">comrak · GFM</span>
      </footer>
    </main>
    <dialog id="unsaved-dialog" class="unsaved-dialog">
      <p class="dialog-text" id="unsaved-text">是否保存更改？</p>
      <div class="dialog-actions">
        <button value="save" class="tool-btn primary">保存</button>
        <button value="discard" class="tool-btn">不保存</button>
        <button value="cancel" class="tool-btn">取消</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
